<!DOCTYPE html>
<html lang="en">
    <style>
        .button {
background-color: 0#400023;
color: white;
padding: 15px 32px;
text-align: center;
text-decoration: none;
display: inline-block;
font-size: 16px;
margin: 4px 2px;
cursor: pointer;
border: none;
border-radius: 8px;
transition: background-color 0.3s ease;

        }
        
        .button:hover {
background: linear-gradient(45deg,#FE70BE, #F60B8A);
}
    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Botão com Animação CSS</h2>
<button class="button">Passe o mouse aqui</button>
</body>
</html>
